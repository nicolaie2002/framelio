<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRAMELIO — Payment successful</title>
    <style>
      :root {
        --bg: #f7f7f4;
        --panel: #ffffff;
        --ink: #131313;
        --muted: #666666;
        --line: rgba(19, 19, 19, 0.08);
        --success: #1d7a4d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 42px 32px;
        max-width: 620px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(18, 18, 18, 0.04);
      }
      .badge {
        display: inline-flex;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(29, 122, 77, 0.12);
        color: var(--success);
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        margin-bottom: 18px;
      }
      h1 { margin: 0 0 12px; }
      p { margin: 0; color: var(--muted); }
      a {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 18px;
        background: var(--ink);
        color: white;
        border-radius: 999px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">✓</div>
      <h1>Payment successful</h1>
      <p>Your FRAMELIO Pro lifetime access is being activated. You can return to the app and continue compressing without limits.</p>
      <a href="/">Back to FRAMELIO</a>
    </div>
  </body>
</html>
